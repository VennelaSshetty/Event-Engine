services:

  redis:
    image: redis:7
    container_name: event-engine-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
    container_name: event-engine-api
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  event-worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
      - api
    command: ["node", "src/workers/eventWorker.js"]

  outbox-worker:
    build:
      context: ./backend
    container_name: event-engine-outbox-worker
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
      - api
    command: ["node", "src/workers/outboxWorker.js"]

  dlq-worker:
    build:
      context: ./backend
    container_name: event-engine-dlq-worker
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
      - api
    command: ["node", "src/workers/dlqWorker.js"]

  frontend:
    build:
      context: ./frontend
    container_name: event-engine-frontend
    ports:
      - "80:80"
    depends_on:
      - api